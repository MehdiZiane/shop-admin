<header>
    <h1>{{ titre }}</h1>
    <nav>
        <a routerLink="catalogue"> Catalogue</a>
        <a routerLink="/panier"> Panier</a>
        <a routerLink="/clients"> Clients</a>
    </nav>
    <p [class.plein]="panier() >= 5"> Panier : {{panier()}} </p>
    <button (click)="ajouter()" [disabled]="panier() >= 5"> ajouter au panier</button>
    <button (click)="vider()" [disabled]="panier() === 0"> vider le panier</button>
</header>

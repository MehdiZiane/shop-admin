<app-panel titre="Filtres">  
  <div class="filtres"> 
    <button (click)="selection.set('Toutes')" [class.actif]="selection() === 'Toutes'">Toutes</button>
    @for (cat of categories; track cat){
      <button (click)="selection.set(cat)" [class.actif]="selection()=== cat ">{{cat}}</button>
    }
  </div>
</app-panel>

<section class="grille">
  @for (product of produitsFiltres(); track product.id) {
    <app-product-card [product]="product" (addToCart)="ajouter($event)" />
  } @empty {
    <p>Aucun produit à afficher.</p>
  }
</section>

<app-panel titre="Recapitulatif">
  <p>Dans le panier : {{ compteur() }}</p>
  <p>Dernier ajout : {{dernierAjout()}}</p>
  <small footer>Prix TTC, TVA 21% incluse</small>
</app-panel>

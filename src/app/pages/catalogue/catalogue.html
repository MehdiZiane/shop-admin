<section class="grille">
  @for (product of produits(); track product.id) {
    <article [class.out-of-stock]="product.stock === 0">
      <img [src]="product.imageUrl" [alt]="product.name">
      <h2>{{ product.name | titlecase }}</h2>
      <p>{{ product.category }}</p>
      <p>{{ product.price | currency: 'EUR' }}</p>
      <p>{{ product.stock | stockLabel }}</p>
      <button (click)="ajouter()" [disabled]="product.stock === 0">Ajouter au panier</button>
    </article>
  } @empty {
    <p>Aucun produit à afficher.</p>
  }
</section>

<p>Dans le panier : {{ compteur() }}</p>
